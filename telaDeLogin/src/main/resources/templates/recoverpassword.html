<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" th:href="@{/css/recoverpassword.css}">
</head>
<body>
    <main>
        <div class="recover-image">
            <img th:src="@{/img/img_login.jpeg}" alt="Imagem De Recuperação De Senha">
        </div>
        <div class="recover-card">
            <h2>Recuperar senha</h2>
            <p class="recover-description">Digite seu e-mail cadastrado e enviaremos um link para você redefinir sua senha.</p>
            <div class="recover-form">
                <input type="email" name="email" id="email" placeholder="E-mail">
                <button type="button" id="recoverSubmitBtn" class="recover-submit-btn">Enviar</button>
                <p id="recoverMessage" class="recover-message"></p>
            </div>
            <p class="recover-footer-text">Lembrou sua senha?</p>
            <p><a href="/login" class="recover-link">Voltar para o login</a></p>
        </div>
    </main>
</body>
</html>
